{% extends 'base.html' %}
{% block content %}
<section class="intro">
  <p class="eyebrow">Head to head</p>
  <h1>Compare players</h1>
  <p class="home-deck">Compare ranked players using the same published score breakdown and context.</p>
</section>

<form class="compare-form" method="get" hx-get="{% url 'compare' %}" hx-target="#comparison-region" hx-push-url="true">
  <label class="text-xs font-bold" for="player-a">Player A</label>
  <select id="player-a" name="a">
    <option value="">Select player</option>
    {% for player in players %}<option value="{{ player.slug }}" {% if a and player.pk == a.pk %}selected{% endif %}>{{ player.name }} — {{ player.get_primary_position_display }}</option>{% endfor %}
  </select>
  <label class="text-xs font-bold" for="player-b">Player B</label>
  <select id="player-b" name="b">
    <option value="">Select player</option>
    {% for player in players %}<option value="{{ player.slug }}" {% if b and player.pk == b.pk %}selected{% endif %}>{{ player.name }} — {{ player.get_primary_position_display }}</option>{% endfor %}
  </select>
  <button class="button" type="submit">Compare</button>
</form>

<div class="mt-8 max-w-xl">
  <label class="block mb-2 text-xs font-bold" for="player-search">Find a player</label>
  <input class="w-full" id="player-search" name="q" type="search" minlength="2" hx-get="{% url 'player_search' %}" hx-trigger="input changed delay:250ms" hx-target="#player-search-results" placeholder="Type at least 2 characters">
  <div id="player-search-results" aria-live="polite"></div>
</div>

<div id="comparison-region" class="mt-10" aria-live="polite">{% include 'players/partials/comparison.html' %}</div>
{% endblock %}
