<ul class="mt-1 border border-line bg-white divide-y divide-line">
  {% for player in players %}
  <li><a class="flex items-center justify-between gap-4 px-3 py-2.5 no-underline hover:bg-soft" href="{% url 'player_detail' player.slug %}"><strong class="text-sm">{{ player.name }}</strong><span class="text-xs text-muted">{{ player.get_primary_position_display }}</span></a></li>
  {% empty %}<li class="px-3 py-3 text-sm text-muted">No matching players.</li>{% endfor %}
</ul>
