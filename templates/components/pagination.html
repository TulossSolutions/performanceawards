{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  <div>{% if page.has_previous %}<a class="font-bold no-underline hover:underline" href="?page={{ page.previous_page_number }}{% if snapshot %}&amp;season={{ snapshot.season.slug }}{% endif %}">← Previous</a>{% endif %}</div>
  <span class="text-xs text-muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  <div>{% if page.has_next %}<a class="font-bold no-underline hover:underline" href="?page={{ page.next_page_number }}{% if snapshot %}&amp;season={{ snapshot.season.slug }}{% endif %}">Next →</a>{% endif %}</div>
</nav>
{% endif %}
