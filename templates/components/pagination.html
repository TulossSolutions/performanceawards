{% if page.has_other_pages %}<nav class="pagination" aria-label="Pagination">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}{% if snapshot %}&amp;season={{ snapshot.season.slug }}{% endif %}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}{% if snapshot %}&amp;season={{ snapshot.season.slug }}{% endif %}">Next</a>{% endif %}</nav>{% endif %}
