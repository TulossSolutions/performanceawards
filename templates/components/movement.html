{% if entry.movement == None %}
<span class="inline-flex items-center bg-ink px-1.5 py-0.5 text-[10px] font-black tracking-[0.08em] text-white" aria-label="New entry">NEW</span>
{% elif entry.movement > 0 %}
<span class="up inline-flex items-center gap-0.5 font-mono text-xs font-black tabular-nums" aria-label="Up {{ entry.movement }} places">↑{{ entry.movement }}</span>
{% elif entry.movement < 0 %}
<span class="down inline-flex items-center gap-0.5 font-mono text-xs font-black tabular-nums" aria-label="Down {{ entry.movement|stringformat:'d'|slice:'1:' }} places">↓{{ entry.movement|stringformat:'d'|slice:'1:' }}</span>
{% else %}
<span class="text-black/30" aria-label="No change">—</span>
{% endif %}
