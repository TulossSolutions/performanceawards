<tr>
  <td class="font-semibold text-ink">{{ metric.label }}</td>
  <td class="font-mono tabular-nums">{% if metric.raw_value != None %}{{ metric.raw_value|floatformat:2 }}{% else %}<span class="text-black/35" title="Unavailable">—</span>{% endif %}</td>
  <td class="font-mono tabular-nums">{% if metric.percentile != None %}<span class="font-bold">{{ metric.percentile|floatformat:1 }}</span><span class="text-black/35">th</span>{% else %}<span class="text-black/35">—</span>{% endif %}</td>
  <td class="font-mono text-black/55 tabular-nums">{{ metric.base_weight|floatformat:2 }}</td>
  <td class="font-mono font-bold tabular-nums">{{ metric.effective_weight|floatformat:2 }}</td>
</tr>
