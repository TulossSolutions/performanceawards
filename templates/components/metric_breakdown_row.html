<tr>
  <td class="font-semibold">{{ metric.label }}</td>
  <td class="tabular-nums">{% if metric.raw_value != None %}{{ metric.raw_value|floatformat:2 }}{% else %}<span class="text-muted" title="Unavailable">—</span>{% endif %}</td>
  <td class="tabular-nums">{% if metric.percentile != None %}{{ metric.percentile|floatformat:1 }}{% else %}<span class="text-muted">—</span>{% endif %}</td>
  <td class="tabular-nums text-muted">{{ metric.base_weight|floatformat:2 }}</td>
  <td class="tabular-nums font-bold">{{ metric.effective_weight|floatformat:2 }}</td>
</tr>
