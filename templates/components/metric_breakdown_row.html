<tr><td>{{ metric.label }}</td><td>{% if metric.raw_value %}{{ metric.raw_value|floatformat:2 }}{% else %}<span title="Zero or unavailable">—</span>{% endif %}</td><td>{% if metric.percentile != None %}{{ metric.percentile|floatformat:1 }}{% else %}—{% endif %}</td><td>{{ metric.base_weight|floatformat:2 }}</td><td>{{ metric.effective_weight|floatformat:2 }}</td></tr>
